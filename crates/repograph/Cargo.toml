[package]
name = "repograph"
version = "0.6.0"
description = "Register, group, and expose local git repos as structured context for AI agents"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
rust-version.workspace = true

[[bin]]
name = "repograph"
path = "src/main.rs"

# `reqwest` is a feature-only dependency — it is never imported in source, so
# cargo-machete's source scan flags it as unused. It is declared solely to union
# the rustls TLS feature onto axoasset's transitive reqwest (see the dependency
# comment below), so the false positive is suppressed here rather than dropped.
[package.metadata.cargo-machete]
ignored = ["reqwest"]

[dependencies]
repograph-core = { path = "../repograph-core", version = "0.6.0" }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
comfy-table = "8"
indicatif = "0.18"
is-terminal = "0.4"
rayon = "1"
cliclack = "=0.5.4"
dirs = "6"
fs-err = { workspace = true }
# Self-update: axoupdater drives receipt-aware in-place upgrades and the version
# query for the passive notifier. `default-features = false` keeps the `blocking`
# feature (and tokio["full"]) out — we drive its async methods on a private
# current-thread runtime instead (see commands/update.rs / update_notify.rs).
axoupdater = { version = "0.10", default-features = false, features = ["github_releases"] }
# Minimal tokio to host the current-thread runtimes that block on async calls —
# axoupdater's (commands/update.rs) and the MCP server's (commands/mcp.rs).
# `net`+`time` enable the IO/time drivers reqwest needs; `io-std` gives the MCP
# stdio transport async stdin/stdout. `io-std` is also unioned on by rmcp's
# `transport-io`, but is declared here so the dependency is visible at this
# call site rather than implied by a transitive feature.
tokio = { version = "1", default-features = false, features = ["rt", "net", "time", "io-std"] }
# MCP server for `repograph mcp serve` — the stdio transport that puts
# repograph's read surface in an agent's tool list. `default-features = false`
# drops `base64` and keeps the client half, every HTTP/SSE transport, and the
# auth stack out of the graph; `server` + `macros` + `transport-io` is the
# minimal set for a stdio tool server. Raises the workspace MSRV to 1.88.
rmcp = { version = "3", default-features = false, features = ["server", "macros", "transport-io"] }
# Tool parameter schemas. rmcp re-exports schemars, but the `JsonSchema` derive
# emits paths rooted at `schemars::`, so it is declared directly. Version "1"
# unifies with rmcp's own schemars — a split would make the derived impls
# invisible to rmcp's trait bounds.
schemars = "1"
# axoasset pulls reqwest with `default-features = false` and NO TLS feature, so
# HTTPS to GitHub would fail. Declaring reqwest here with rustls-tls unions that
# feature onto the shared reqwest in the graph — rustls (not system OpenSSL) so
# the windows-msvc and linux-gnu cross targets need no OpenSSL headers.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "json"] }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { workspace = true }
serde_json = { workspace = true }
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }

[features]
default = []
# Forward semantic retrieval to the core crate so the documented single-package
# install (`cargo install repograph --features semantic`) actually resolves and
# compiles embeddings into the binary. Without this passthrough the flag only
# took effect on a whole-workspace build via feature unification.
semantic = ["repograph-core/semantic"]

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
serde_json = { workspace = true }
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }

[lints]
workspace = true
